baseURL: "https://phuchungbhutia.github.io/"
title: "Technical Journal"
theme: "PaperMod"
locale: "en"
defaultContentLanguage: "en"

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

# Allow raw HTML blocks in Markdown
markup:
  goldmark:
    renderer:
      unsafe: true

# Keep minification from choking on JSON-LD
minify:
  disableJSON: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: Search
      url: search/
      weight: 10
    - name: Categories
      url: categories/
      weight: 20
    - name: Tags
      url: tags/
      weight: 30
    - name: Archives
      url: archives/
      weight: 40

params:
  env: production
  author: "Phuchung Bhutia"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  # Disable PaperMod schema to prevent template JSON-LD crashes
  schema:
    publisherType: "Person"

  profileMode:
    enabled: true
    title: "Phuchung Bhutia"
    subtitle: "Web Development"
    buttons:
      - name: Posts
        url: posts/
      - name: Categories
        url: categories/
      - name: Tags
        url: tags/

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 100
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]